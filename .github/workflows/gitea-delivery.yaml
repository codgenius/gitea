name: Build and deliver Gitea

on:
  push:
    branches: [main]
    paths-ignore:
      - deploy/guardian-demo/**
      - deploy/guardian-prod/**

permissions: {}

concurrency:
  group: gitea-main-delivery
  cancel-in-progress: true

jobs:
  deliver:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Reject generated delivery commits
        run: .github/scripts/should-deliver.sh
      - name: Build and push immutable image
        env:
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          test "${#SOURCE_SHA}" -eq 40
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin
          docker build --file Dockerfile.rootless --tag "$IMAGE:$SOURCE_SHA" .
          docker push "$IMAGE:$SOURCE_SHA"
      - name: Record the delivered source identity
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          test "${#SOURCE_SHA}" -eq 40
          sed -i "s#ghcr.io/codgenius/gitea:[0-9a-f]\{40\}#ghcr.io/codgenius/gitea:$SOURCE_SHA#" deploy/guardian-prod/deployment.yaml
          sed -i "s#guardian.fursa.click/commit-sha: [0-9a-f]\{40\}#guardian.fursa.click/commit-sha: $SOURCE_SHA#g" deploy/guardian-prod/deployment.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/guardian-prod/deployment.yaml
          git commit -m "ci: deliver Gitea $SOURCE_SHA [gitea-delivery]"
          pushed=false
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              pushed=true
              break
            fi
            if [[ "$attempt" != 3 ]]; then
              git fetch origin main
              git rebase origin/main
            fi
          done
          if [[ "$pushed" != true ]]; then
            echo "Stable manifest push failed after three attempts." >&2
            exit 1
          fi

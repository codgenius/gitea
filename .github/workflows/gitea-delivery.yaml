name: Build and deliver Gitea

on:
  push:
    branches: [main]
    paths-ignore:
      - deploy/guardian-demo/**
      - deploy/guardian-prod/**

permissions: {}

concurrency:
  group: gitea-main-delivery
  cancel-in-progress: true

jobs:
  deliver:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Reject generated delivery commits
        run: .github/scripts/should-deliver.sh
      - name: Build and push immutable image
        env:
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          test "${#SOURCE_SHA}" -eq 40
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin
          docker build --file Dockerfile.rootless --tag "$IMAGE:$SOURCE_SHA" .
          docker push "$IMAGE:$SOURCE_SHA"
      - name: Record the delivered source identity
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          manifest=deploy/guardian-prod/deployment.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pushed=false
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git merge-base --is-ancestor "$SOURCE_SHA" origin/main; then
              echo "Delivery source is not an ancestor of current main." >&2
              exit 1
            fi
            superseding_source=
            while IFS= read -r commit; do
              if git diff-tree --root -m --first-parent --no-commit-id --name-only -r "$commit" |
                awk '$0 !~ /^deploy\/guardian-demo(\/|$)/ && $0 !~ /^deploy\/guardian-prod(\/|$)/ { found=1 } END { exit(found ? 0 : 1) }'; then
                superseding_source=$commit
                break
              fi
            done < <(git rev-list --first-parent "$SOURCE_SHA..origin/main")
            if [[ -n "$superseding_source" ]]; then
              echo "Stable delivery $SOURCE_SHA was superseded by $superseding_source."
              pushed=true
              break
            fi
            git reset --hard origin/main
            if [[ "$(grep -Ec '^[[:space:]]*image: ghcr.io/codgenius/gitea:[0-9a-f]{40}$' "$manifest")" != 2 ]]; then
              echo "Expected exactly two immutable Gitea image references." >&2
              exit 1
            fi
            if [[ "$(grep -Ec '^[[:space:]]*guardian\.fursa\.click/commit-sha: [0-9a-f]{40}$' "$manifest")" != 2 ]]; then
              echo "Expected exactly two immutable commit annotations." >&2
              exit 1
            fi
            sed -i "s#ghcr.io/codgenius/gitea:[0-9a-f]\{40\}#ghcr.io/codgenius/gitea:$SOURCE_SHA#" "$manifest"
            sed -i "s#guardian.fursa.click/commit-sha: [0-9a-f]\{40\}#guardian.fursa.click/commit-sha: $SOURCE_SHA#g" "$manifest"
            if [[ "$(grep -c "$SOURCE_SHA" "$manifest")" != 4 ]]; then
              echo "Stable SHA was not recorded in every immutable identity field." >&2
              exit 1
            fi
            git add -- "$manifest"
            if git diff --cached --quiet; then
              pushed=true
              break
            fi
            git commit -m "ci: deliver Gitea $SOURCE_SHA [gitea-delivery]"
            if git push origin HEAD:main; then
              pushed=true
              break
            fi
            echo "Stable manifest push attempt $attempt failed; rebuilding from origin/main." >&2
          done
          if [[ "$pushed" != true ]]; then
            echo "Stable manifest push failed after three attempts." >&2
            exit 1
          fi
